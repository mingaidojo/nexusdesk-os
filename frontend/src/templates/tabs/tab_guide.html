<!-- TAB: HELP & FEATURE GUIDE -->
<section id="tab-guide" class="hidden space-y-4 max-w-6xl mx-auto font-sans">
  <!-- Compact Hero Header, Search Bar & 5-Stage Customer Journey Stepper -->
  <div class="bg-[#161b22] border border-[#30363d] rounded-2xl p-4 sm:p-5 space-y-4 shadow-sm">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-start gap-3">
        <div class="w-9 h-9 rounded-xl bg-[#58a6ff]/10 border border-[#58a6ff]/30 flex items-center justify-center shrink-0 text-[#58a6ff] mt-0.5" aria-hidden="true">
          <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h2 class="text-sm sm:text-base font-bold font-pixel text-[#f0f6fc] tracking-tight">
              NexusDesk Customer Journey &amp; Guide
            </h2>
            <span class="text-[10px] px-2 py-0.5 rounded-md bg-[#21262d] text-[#58a6ff] border border-[#30363d] font-mono font-semibold">Ctrl+/</span>
          </div>
          <p class="text-xs text-[#8b949e] mt-0.5 leading-relaxed">
            Step-by-step plain-English playbook aligned to the exact menus and buttons inside NexusDesk OS.
          </p>
        </div>
      </div>
      <div class="text-[11px] font-medium text-[#8b949e] bg-[#0d1117] border border-[#30363d] rounded-lg px-2.5 py-1 shrink-0 self-start sm:self-center" id="guide-count-badge">
        Loading guide...
      </div>
    </div>

    <!-- Search Input -->
    <div class="relative">
      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8b949e] pointer-events-none" aria-hidden="true">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
      </span>
      <input
        type="search"
        id="guide-search-input"
        oninput="onGuideSearchInput(this.value)"
        placeholder="Search by goal, menu name, or action (e.g. Data Explorer, 5D Guardrails, voice note, poll, reminder, failover)..."
        class="w-full bg-[#0d1117] border border-[#30363d] focus:border-[#58a6ff] rounded-xl pl-10 pr-20 py-2.5 text-xs text-[#f0f6fc] placeholder-[#6e7681] focus:outline-none transition"
      />
      <button
        type="button"
        onclick="clearGuideSearch()"
        id="guide-search-clear-btn"
        class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] px-2.5 py-1 rounded-lg bg-[#21262d] hover:bg-[#30363d] text-[#c9d1d9] border border-[#30363d] font-medium transition"
      >
        Clear
      </button>
    </div>

    <!-- 5-Stage Customer Journey Filter Bar -->
    <div class="space-y-1.5">
      <div class="text-[10px] font-semibold uppercase tracking-wider text-[#8b949e]">
        Follow-Up Customer Journey
      </div>
      <div class="flex items-center gap-1.5 flex-wrap text-[11px]" id="guide-journey-pills" role="tablist" aria-label="Customer Journey Stages">
        <button type="button" role="tab" aria-selected="true" onclick="setGuideStage('all')" id="guide-stage-all" class="px-3 py-1.5 rounded-lg bg-[#58a6ff]/15 text-[#58a6ff] border border-[#58a6ff]/50 font-semibold transition">All Steps (9)</button>
        <button type="button" role="tab" aria-selected="false" onclick="setGuideStage('connect')" id="guide-stage-connect" class="px-3 py-1.5 rounded-lg bg-[#0d1117] text-[#8b949e] border border-[#30363d] hover:text-[#f0f6fc] hover:border-[#484f58] font-medium transition">1 · Connect &amp; Secure</button>
        <button type="button" role="tab" aria-selected="false" onclick="setGuideStage('setup')" id="guide-stage-setup" class="px-3 py-1.5 rounded-lg bg-[#0d1117] text-[#8b949e] border border-[#30363d] hover:text-[#f0f6fc] hover:border-[#484f58] font-medium transition">2 · Knowledge &amp; Roles</button>
        <button type="button" role="tab" aria-selected="false" onclick="setGuideStage('daily')" id="guide-stage-daily" class="px-3 py-1.5 rounded-lg bg-[#0d1117] text-[#8b949e] border border-[#30363d] hover:text-[#f0f6fc] hover:border-[#484f58] font-medium transition">3 · Daily Chat &amp; Voice</button>
        <button type="button" role="tab" aria-selected="false" onclick="setGuideStage('automate')" id="guide-stage-automate" class="px-3 py-1.5 rounded-lg bg-[#0d1117] text-[#8b949e] border border-[#30363d] hover:text-[#f0f6fc] hover:border-[#484f58] font-medium transition">4 · Schedules &amp; Follow-Ups</button>
        <button type="button" role="tab" aria-selected="false" onclick="setGuideStage('scale')" id="guide-stage-scale" class="px-3 py-1.5 rounded-lg bg-[#0d1117] text-[#8b949e] border border-[#30363d] hover:text-[#f0f6fc] hover:border-[#484f58] font-medium transition">5 · AI Team &amp; System</button>
      </div>
    </div>
  </div>

  <!-- Master-Detail Layout -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
    <!-- Left Column: Ordered Journey Cards -->
    <div class="lg:col-span-5 space-y-2 max-h-[68vh] overflow-y-auto pr-1 custom-scrollbar" id="guide-feature-list" aria-label="Guide topics">
      <!-- Populated by guide.js -->
    </div>

    <!-- Right Column: Detailed Guide, Visual Infographic, Rules & Follow-Up Navigation -->
    <div class="lg:col-span-7 bg-[#161b22] border border-[#30363d] rounded-2xl p-4 sm:p-6 space-y-5 text-xs lg:sticky lg:top-4 shadow-sm" id="guide-detail-panel">
      <!-- Populated by guide.js -->
    </div>
  </div>
</section>
