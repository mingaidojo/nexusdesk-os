<!-- Edit Default Global Model Modal -->
  <div id="global-model-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-slate-800 rounded-2xl max-w-lg w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <!-- Pinned Header -->
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-lg bg-cyan-950 border border-cyan-800 flex items-center justify-center text-xs text-cyan-400 font-pixel">🌐</span>
          <h3 class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">EDIT DEFAULT GLOBAL MODEL</h3>
        </div>
        <button onclick="closeEditGlobalModelModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>
      
      <!-- Scrollable Body -->
      <div class="space-y-3.5 text-xs font-mono p-4 sm:p-5 overflow-y-auto flex-1 custom-scrollbar">
        <div>
          <label class="text-slate-400 block mb-1">Global Default Model</label>
          <input id="modal-global-model-input" type="text" placeholder="e.g. deepseek-ai/DeepSeek-V4.1-Flash" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-cyan-300 font-mono text-xs focus:outline-none focus:border-cyan-500" />
          <div class="flex flex-wrap gap-1 mt-1.5">
            <span class="text-[10px] text-slate-500 mr-1 self-center">Picks:</span>
            <button type="button" onclick="document.getElementById('modal-global-model-input').value='deepseek-ai/DeepSeek-V4.1-Flash'" class="px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-slate-300">deepseek-v4</button>
            <button type="button" onclick="document.getElementById('modal-global-model-input').value='abacus/gpt-4.1-mini'" class="px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-slate-300">gpt-4.1-mini</button>
            <button type="button" onclick="document.getElementById('modal-global-model-input').value='abacus/gemini-3.8-flash'" class="px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-slate-300">gemini-3.8</button>
            <button type="button" onclick="document.getElementById('modal-global-model-input').value='nvidia/nemotron-3-ultra-550b-a55b'" class="px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-slate-300">nemotron-ultra</button>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="text-slate-400 block mb-1">Provider</label>
            <input id="modal-global-provider-input" type="text" placeholder="abacus" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 font-mono text-xs focus:outline-none focus:border-cyan-500" />
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Base URL (optional)</label>
            <input id="modal-global-url-input" type="text" placeholder="https://routellm.abacus.ai/v1" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 font-mono text-xs focus:outline-none focus:border-cyan-500" />
          </div>
        </div>
      </div>

      <!-- Pinned Footer -->
      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-end gap-2 shrink-0 z-10">
        <button onclick="closeEditGlobalModelModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition cursor-pointer">Cancel</button>
        <button onclick="submitSaveGlobalModel()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-md cursor-pointer">
          <span>💾</span> <span>Save Global Default</span>
        </button>
      </div>
    </div>
  </div>
