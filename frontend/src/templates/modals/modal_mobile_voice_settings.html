<!-- BL-UI-48: Samsung S22 Ultra Mobile Voice Profile Settings Modal -->
<div id="mobile-voice-settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[110] hidden flex items-center justify-center p-3 sm:p-4 overflow-hidden">
  <div class="bg-[#161b22] border border-slate-700/80 rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-in fade-in zoom-in-95 duration-150">
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800 shrink-0 bg-slate-900/50">
      <div class="flex items-center gap-2">
        <span class="text-base">🎙️</span>
        <div>
          <h3 class="font-bold text-xs sm:text-sm text-slate-100 font-pixel tracking-wide">VOICE & SYNTHESIZER</h3>
          <p class="text-[9.5px] text-slate-400 font-mono">Agent voice profile & audio parameters</p>
        </div>
      </div>
      <button type="button" onclick="toggleMobileVoiceSettingsModal(false)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm font-bold transition cursor-pointer">✕</button>
    </div>

    <!-- Body -->
    <div class="p-4 space-y-3.5 overflow-y-auto custom-scrollbar flex-1 text-xs">
      <div>
        <label class="text-slate-400 block mb-1 text-[10px] uppercase font-mono flex items-center justify-between">
          <span>TTS Engine</span>
          <span id="modal-tts-engine-status-badge" class="text-emerald-400 font-bold text-[9px] px-1.5 py-0.2 rounded bg-emerald-950/80 border border-emerald-800">EDGE NEURAL</span>
        </label>
        <select id="modal-tts-engine-picker" onchange="switchTtsEngine(this.value); syncVoiceSettingsUi();" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 font-mono text-xs focus:outline-none focus:border-cyan-500">
          <option value="edge">Edge-TTS (Studio Neural, Zero-Load)</option>
          <option value="piper">Piper-TTS (Local Offline, Fast ONNX)</option>
          <option value="browser">Browser WebSpeech (Client Fallback)</option>
        </select>
      </div>

      <div>
        <label class="text-slate-400 block mb-1 text-[10px] uppercase font-mono flex items-center justify-between">
          <span>Speech Scope</span>
          <span id="modal-tts-scope-badge" class="text-cyan-400 font-bold text-[9px] px-1.5 py-0.2 rounded bg-cyan-950/80 border border-cyan-800">1ST SENTENCE</span>
        </label>
        <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-lg border border-slate-800">
          <button type="button" id="modal-btn-scope-first" onclick="switchTtsSpeechScope('first_sentence'); syncVoiceSettingsUi();" class="py-1.5 px-2 text-[10px] font-mono rounded text-center transition bg-cyan-600/30 text-cyan-300 font-semibold border border-cyan-500/40 cursor-pointer">1st Sentence</button>
          <button type="button" id="modal-btn-scope-full" onclick="switchTtsSpeechScope('full'); syncVoiceSettingsUi();" class="py-1.5 px-2 text-[10px] font-mono rounded text-center transition text-slate-400 hover:text-slate-200 border border-transparent cursor-pointer">Full Output</button>
        </div>
      </div>

      <div>
        <label class="text-slate-400 block mb-1 text-[10px] uppercase font-mono">Synthesizer Voice</label>
        <select id="modal-voice-picker" onchange="updateAgentVoiceSettingFromModal()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 font-mono text-xs focus:outline-none focus:border-cyan-500">
          <option value="default">Default System Voice</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <div>
          <label class="text-slate-400 block mb-1 text-[10px] font-mono">Pitch: <span id="modal-val-pitch" class="text-emerald-400">1.0</span></label>
          <input id="modal-range-pitch" type="range" min="0.5" max="1.6" step="0.05" value="1.0" oninput="updateAgentVoiceSettingFromModal()" class="w-full accent-cyan-500" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1 text-[10px] font-mono">Speed: <span id="modal-val-rate" class="text-emerald-400">1.0</span></label>
          <input id="modal-range-rate" type="range" min="0.7" max="1.5" step="0.05" value="1.0" oninput="updateAgentVoiceSettingFromModal()" class="w-full accent-cyan-500" />
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-4 py-3 border-t border-slate-800 bg-slate-900/40 flex items-center justify-between shrink-0">
      <button onclick="testAgentVoiceSample()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 text-xs font-mono font-semibold transition cursor-pointer flex items-center gap-1.5">
        <span>🔊</span> <span>Test Sample</span>
      </button>
      <button onclick="toggleMobileVoiceSettingsModal(false)" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold font-mono transition cursor-pointer">
        Done
      </button>
    </div>
  </div>
</div>
