<!-- MODAL: MANUAL FRICTION REPORTING (BL-SYS-21) -->
  <div id="modal-self-evolving-report" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[130] hidden flex items-center justify-center p-2.5 sm:p-4 overflow-hidden" onclick="if(event.target===this) closeSelfEvolvingReportModal()">
    <div class="bg-[#161b22] border border-slate-700 rounded-2xl max-w-lg w-full shadow-2xl flex flex-col max-h-[85vh] overflow-hidden font-mono">
      <div class="flex justify-between items-center px-4 py-3 border-b border-slate-800 bg-[#0d1117] shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-base">➕</span>
          <div class="min-w-0">
            <h3 class="font-bold text-xs sm:text-sm text-slate-100 font-pixel truncate">REPORT FRICTION OR BUG</h3>
            <span class="text-[10px] text-slate-400 truncate block">Direct Telemetry Ingestion</span>
          </div>
        </div>
        <button onclick="closeSelfEvolvingReportModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 custom-scrollbar space-y-3 text-xs">
        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Category</label>
          <select id="report-category-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono">
            <option value="UX & Friction">🏷️ UX & Friction</option>
            <option value="Engine & Timeouts">⚙️ Engine & Timeouts</option>
            <option value="Permissions">🔒 Permissions</option>
            <option value="Missing Tools">🧩 Missing Tools</option>
            <option value="Feature Requests">🚀 Feature Requests</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Operational Pillar</label>
          <select id="report-pillar-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono">
            <option value="system_core">System Core</option>
            <option value="operations">Operations (CLI / Subprocess)</option>
            <option value="models">Models & Failover</option>
            <option value="mcp_tools">MCP Tools</option>
            <option value="workflows">Workflows & Crons</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Issue Summary</label>
          <input id="report-summary-input" type="text" placeholder="e.g. Chat subprocess timed out when fetching large file" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono" />
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Details / Error Stack (Optional)</label>
          <textarea id="report-details-input" rows="3" placeholder="Paste error message or steps to reproduce..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono"></textarea>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Affected Files (Comma-separated, optional)</label>
          <input id="report-files-input" type="text" placeholder="e.g. backend/routers/chat.py, frontend/src/templates/body.html" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono" />
        </div>

        <!-- File Upload / Attachments Dropzone (BL-SYS-37) -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-[10px] text-slate-400 font-bold uppercase block">Upload Screenshots / Log Files (Optional)</label>
            <span class="text-[9px] text-slate-500">Max 5 files • 25 MB/file</span>
          </div>
          <div id="report-drop-zone"
               ondragover="handleReportDragOver(event)"
               ondragleave="handleReportDragLeave(event)"
               ondrop="handleReportFileDrop(event)"
               class="border border-dashed border-slate-700 hover:border-emerald-500/70 rounded-xl p-2.5 bg-slate-950/70 transition flex flex-col gap-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10.5px] text-slate-400 truncate">📎 Drag & drop screenshots, logs, or specs here</span>
              <label for="report-file-upload-input" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-emerald-400 text-[10.5px] font-semibold cursor-pointer shrink-0 transition">
                + Attach Files
              </label>
              <input id="report-file-upload-input" type="file" multiple class="hidden" onchange="handleReportFileSelect(event)" />
            </div>
            <div id="report-attachment-ribbon" class="hidden flex flex-wrap gap-1.5 pt-1 border-t border-slate-800/80"></div>
          </div>
        </div>

        <!-- Instant Backlog Promotion Option -->
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="report-create-backlog-check" checked class="w-3.5 h-3.5 rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0 cursor-pointer" />
          <label for="report-create-backlog-check" class="text-[11px] text-slate-300 cursor-pointer select-none">
            Also create an active <strong class="text-emerald-400">PRD Backlog Card</strong> immediately (ready for Vibecoding / Self-Patch)
          </label>
        </div>

        <!-- Inline Status / Feedback Banner -->
        <div id="report-submit-feedback" class="hidden p-2.5 rounded-lg border text-[11px] font-mono"></div>
      </div>

      <div class="px-4 py-3 border-t border-slate-800 bg-[#0d1117] flex justify-end gap-2 shrink-0">
        <button type="button" onclick="closeSelfEvolvingReportModal()" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition cursor-pointer">Cancel</button>
        <button type="button" id="btn-submit-self-evolving-report" onclick="submitSelfEvolvingReport()" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition cursor-pointer flex items-center gap-1.5 shadow-md">
          <span>📥</span> <span>Submit to Buffer</span>
        </button>
      </div>
    </div>
  </div>
