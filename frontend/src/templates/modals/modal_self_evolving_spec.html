<!-- MODAL: SELF-EVOLVING VIBECODING SPEC & PROMPT EXPORTER (BL-SYS-22 OPTION A) -->
  <div id="modal-self-evolving-spec" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[130] hidden flex items-center justify-center p-2.5 sm:p-4 overflow-hidden" onclick="if(event.target===this) closeSelfEvolvingSpecModal()">
    <div class="bg-[#161b22] border border-emerald-700/80 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[90vh] overflow-hidden font-mono">
      <div class="flex justify-between items-center px-4 py-3 border-b border-slate-800 bg-[#0d1117] shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-base">📋</span>
          <div class="min-w-0">
            <h3 class="font-bold text-xs sm:text-sm text-slate-100 font-pixel truncate" id="evo-spec-modal-title">VIBECODING SPECIFICATION & PROMPT</h3>
            <span class="text-[10px] text-emerald-400 truncate block">Ready for Antigravity, Claude Code, Cursor & OpenCode</span>
          </div>
        </div>
        <button onclick="closeSelfEvolvingSpecModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 custom-scrollbar space-y-3 text-xs">
        <div id="evo-spec-meta-pills" class="flex flex-wrap gap-1.5 pb-2 border-b border-slate-800 text-[10px]">
          <!-- Metadata pills dynamically rendered -->
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Generated Task Prompt (Click Copy or Export)</label>
          <pre id="evo-spec-content" class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-[11px] font-mono text-emerald-300/90 whitespace-pre-wrap select-all max-h-96 overflow-y-auto custom-scrollbar leading-relaxed">Loading specification...</pre>
        </div>
      </div>

      <div class="px-4 py-3 border-t border-slate-800 bg-[#0d1117] flex flex-wrap items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2">
          <button type="button" onclick="copyVibecodingPrompt()" id="btn-copy-evo-prompt" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
            <span>📋 Copy Prompt</span>
          </button>
          <button type="button" onclick="exportTaskSpecFile()" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 hover:border-slate-500 text-slate-300 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
            <span>📥 Export .md</span>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="openSelfEvolvingPatchModalFromSpec()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
            <span>🧬 Assign Self-Patch</span>
          </button>
          <button onclick="closeSelfEvolvingSpecModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition cursor-pointer">Close</button>
        </div>
      </div>
    </div>
  </div>
