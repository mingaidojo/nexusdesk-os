<!-- Workflow Run Inspection & Artifacts Modal (BL-AUTO-36) -->
  <div id="workflow-run-inspect-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[115] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-slate-800 rounded-2xl max-w-3xl w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-cyan-400 text-lg">⚡</span>
          <div>
            <h3 id="run-inspect-modal-title" class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">WORKFLOW RUN INSPECTOR</h3>
            <span id="run-inspect-modal-subtitle" class="text-[9px] sm:text-[10px] text-slate-400 font-mono">Step execution breakdown and passed artifacts</span>
          </div>
        </div>
        <button onclick="closeWorkflowRunInspectModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>
      
      <div class="p-3.5 sm:p-5 overflow-y-auto flex-1 custom-scrollbar space-y-3.5">
        <!-- Overview Banner -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs font-mono">
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Status</span>
            <span id="run-inspect-status" class="font-bold">--</span>
          </div>
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Engine</span>
            <span id="run-inspect-engine" class="font-bold text-cyan-400">NexusDesk DAG</span>
          </div>
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Duration</span>
            <span id="run-inspect-duration" class="font-bold text-emerald-400">--</span>
          </div>
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Trigger Source</span>
            <span id="run-inspect-trigger" class="font-bold text-cyan-300">--</span>
          </div>
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Started At</span>
            <span id="run-inspect-started" class="font-bold text-slate-300">--</span>
          </div>
        </div>

        <!-- Steps Timeline Execution Flow -->
        <div>
          <label class="text-slate-300 font-semibold block mb-2 text-xs font-mono">Step Handovers &amp; Generated Artifacts</label>
          <div id="run-inspect-steps-timeline" class="space-y-2">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-end shrink-0">
        <button onclick="closeWorkflowRunInspectModal()" class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition cursor-pointer">Close</button>
      </div>
    </div>
  </div>
