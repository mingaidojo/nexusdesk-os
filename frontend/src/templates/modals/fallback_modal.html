<!-- Add / Edit Fallback Provider Modal -->
  <div id="fallback-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-slate-800 rounded-2xl max-w-lg w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <!-- Pinned Header -->
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <h3 id="modal-fb-title" class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">EDIT FALLBACK STEP</h3>
        <button onclick="closeAddFallbackModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>
      <input type="hidden" id="modal-fb-index" value="-1" />
      
      <!-- Scrollable Body -->
      <div class="space-y-3.5 text-xs p-4 sm:p-5 overflow-y-auto flex-1 custom-scrollbar">
        <div>
          <label class="text-slate-400 block mb-1">Provider Name (e.g. nous, cloudflare, abacus, groq, nvidia)</label>
          <input id="modal-fb-provider" type="text" placeholder="provider (e.g. nous, groq)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono text-xs focus:outline-none focus:border-cyan-500" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Model Identifier</label>
          <input id="modal-fb-model" type="text" placeholder="e.g. inclusionai/ling-3.1-flash or gemini-3.8-flash" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-cyan-400 font-mono text-xs focus:outline-none focus:border-cyan-500" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Base URL (optional)</label>
          <input id="modal-fb-baseurl" type="text" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-300 font-mono text-xs focus:outline-none focus:border-cyan-500" />
        </div>
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-slate-300 font-semibold text-xs flex items-center gap-1.5">
              <span>🤖</span> <span>Assigned Agents for this Fallback:</span>
            </label>
            <button type="button" onclick="toggleAllModalAgentCheckboxes()" id="modal-fb-all-toggle-btn" class="text-[11px] text-cyan-400 hover:text-cyan-300 font-mono font-semibold cursor-pointer">Toggle All</button>
          </div>
          <div id="modal-fb-agents-checkboxes" class="grid grid-cols-2 gap-2 bg-slate-950 p-2.5 rounded-lg border border-slate-800 max-h-36 overflow-y-auto custom-scrollbar">
            <!-- Dynamically populated checkboxes -->
          </div>
          <p class="text-[10px] text-slate-500 mt-1">If all agents are checked, global automatic failover applies. Uncheck agents to restrict this route.</p>
        </div>
      </div>

      <!-- Pinned Footer -->
      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-end gap-2 shrink-0 z-10">
        <button onclick="closeAddFallbackModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition cursor-pointer">Cancel</button>
        <button onclick="submitSaveFallbackStep()" id="modal-fb-submit-btn" class="px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold transition cursor-pointer">Save Step</button>
      </div>
    </div>
  </div>
