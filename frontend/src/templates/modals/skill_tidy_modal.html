<!-- AI Skill Tidy & Visual Diff Review Modal (BL-AUTO-37) -->
  <div id="skill-tidy-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[115] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-cyan-800/80 rounded-2xl max-w-4xl w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[90vh] overflow-hidden">
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-amber-400 text-lg">🧹</span>
          <div>
            <h3 class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">AI SKILL TIDY &amp; VISUAL DIFF REVIEW</h3>
            <span id="skill-tidy-modal-sub" class="text-[9px] sm:text-[10px] text-slate-400 font-mono">Review proposed deduplication, safety linter flags, and unified diff</span>
          </div>
        </div>
        <button onclick="closeSkillTidyModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>

      <div class="p-3.5 sm:p-5 overflow-y-auto flex-1 custom-scrollbar space-y-3 font-mono text-xs">
        <!-- Linter Warnings Banner -->
        <div id="skill-tidy-warnings-box" class="hidden p-3 rounded-xl bg-amber-950/80 border border-amber-700 text-amber-200 text-xs space-y-1">
          <div class="font-bold flex items-center gap-1.5 text-amber-300">
            <span>🛡️</span> <span>Safety Linter Warnings &amp; Omission Checks:</span>
          </div>
          <div id="skill-tidy-warnings-list" class="pl-5 space-y-0.5 text-[11px] list-disc"></div>
        </div>

        <!-- Metrics comparison strip -->
        <div class="grid grid-cols-3 gap-2">
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Original Characters</span>
            <span id="tidy-stat-orig" class="text-white font-bold">--</span>
          </div>
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Cleaned Characters</span>
            <span id="tidy-stat-clean" class="text-emerald-400 font-bold">--</span>
          </div>
          <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="text-slate-500 text-[10px] block">Reduction</span>
            <span id="tidy-stat-reduction" class="text-cyan-400 font-bold">--</span>
          </div>
        </div>

        <!-- Unified Diff View -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-slate-300 font-semibold block text-xs">Side-by-Side Unified Diff Preview</label>
            <div class="flex items-center gap-2 text-[10px]">
              <span class="text-emerald-400 font-bold">+ Added / Kept</span>
              <span>•</span>
              <span class="text-rose-400 font-bold">- Removed / Deduplicated</span>
            </div>
          </div>
          <div id="skill-tidy-diff-container" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-[11px] leading-relaxed max-h-[45vh] overflow-y-auto overflow-x-auto whitespace-pre font-mono custom-scrollbar"></div>
        </div>
      </div>

      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-between items-center shrink-0">
        <span class="text-[10px] text-slate-500 font-mono">Creates automatic timestamped .bak on apply</span>
        <div class="flex gap-2">
          <button onclick="closeSkillTidyModal()" class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition cursor-pointer">Discard</button>
          <button onclick="applySkillTidyChanges()" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition shadow cursor-pointer">
            ✅ Accept Changes &amp; Save
          </button>
        </div>
      </div>
    </div>
  </div>
