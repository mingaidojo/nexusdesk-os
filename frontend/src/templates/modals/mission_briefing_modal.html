<!-- Interactive Mission Briefing Dashboard Modal -->
  <div id="mission-briefing-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-cyan-800/80 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <!-- Pinned Header -->
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-lg bg-cyan-950 border border-cyan-700 flex items-center justify-center text-xs text-cyan-400 font-pixel">📡</span>
          <div>
            <h3 class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">MISSION BRIEFING DASHBOARD</h3>
            <span class="text-[9px] sm:text-[10px] text-cyan-400 font-mono">ALL-HANDS PIPELINE INSPECTOR</span>
          </div>
        </div>
        <button onclick="closeMissionBriefingModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>

      <!-- Scrollable Body -->
      <div class="space-y-3.5 text-xs font-mono p-3.5 sm:p-5 overflow-y-auto flex-1 custom-scrollbar">
        <!-- Pipeline Status Banner -->
        <div class="bg-slate-950 p-2.5 sm:p-3 rounded-xl border border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
            <strong id="briefing-pipeline-title" class="text-emerald-300 text-xs truncate">PIPELINE READY: BIBLESTORYAPP DAILY DOSES</strong>
          </div>
          <span id="briefing-pipeline-badge" class="px-2 py-0.5 rounded bg-emerald-950 border border-emerald-700 text-[10px] text-emerald-300 font-bold shrink-0">AUTOMATED</span>
        </div>

        <!-- Sequential Pipeline Visual Flow -->
        <div class="space-y-1.5">
          <span class="text-slate-400 font-semibold text-[11px] uppercase tracking-wider block">Pipeline Execution Sequence:</span>
          <div id="briefing-pipeline-stages" class="grid grid-cols-1 sm:grid-cols-5 gap-2 text-center">
            <!-- Populated dynamically per active fleet -->
          </div>
        </div>

        <!-- Schedule & Trigger Timing -->
        <div class="bg-slate-950 p-2.5 sm:p-3 rounded-xl border border-slate-800 grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-[11px]">
          <div>
            <span class="text-slate-500 block text-[10px] uppercase">User Schedule (Local):</span>
            <strong id="briefing-user-time" class="text-cyan-300">Daily at 08:00 AM (GMT+7)</strong>
          </div>
          <div>
            <span class="text-slate-500 block text-[10px] uppercase">Execution Mode / Schedule:</span>
            <strong id="briefing-server-time" class="text-slate-200">Daily at 02:00 AM CEST</strong>
          </div>
        </div>
      </div>

      <!-- Pinned Footer -->
      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-between items-center shrink-0 z-10">
        <button onclick="triggerBriefingSimulation(); closeMissionBriefingModal();" class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl bg-amber-950/80 hover:bg-amber-900 text-amber-300 border border-amber-800 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
          <span>👥</span> <span class="hidden sm:inline">Call All-Hands Meeting</span><span class="sm:hidden">All-Hands</span>
        </button>
        <div class="flex gap-2">
          <button onclick="closeMissionBriefingModal()" class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition cursor-pointer">Close</button>
          <button onclick="switchMainTab('workflows'); closeMissionBriefingModal();" class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-md cursor-pointer">
            <span>⚡</span> <span class="hidden sm:inline">Open Workflows</span><span class="sm:hidden">Workflows</span>
          </button>
        </div>
      </div>
    </div>
  </div>
