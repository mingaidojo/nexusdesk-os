<!-- Agent Deploy / Edit / Decommission Modal -->
  <div id="agent-crud-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-slate-800 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <!-- Modal Header (Pinned) -->
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-lg bg-emerald-950 border border-emerald-800 flex items-center justify-center text-xs text-emerald-400 font-pixel">🤖</span>
          <div>
            <h3 id="modal-crud-title" class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">DEPLOY NEW SPECIALIST AGENT</h3>
            <span class="text-[9px] sm:text-[10px] text-cyan-400 font-mono">HERMES MULTI-AGENT CLUSTER</span>
          </div>
        </div>
        <button onclick="closeAgentCrudModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>

      <input type="hidden" id="modal-crud-mode" value="create" />
      <input type="hidden" id="modal-crud-orig-name" value="" />

      <!-- Modal Body (Scrollable, 2-column adaptive layout) -->
      <div class="space-y-3.5 text-xs font-mono p-3.5 sm:p-5 overflow-y-auto flex-1 custom-scrollbar">
        <!-- Row 1: Agent Identity -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="text-slate-400 block mb-1">Agent Name <span class="text-rose-400">*</span></label>
            <input id="modal-crud-name" type="text" placeholder="e.g. Sentinel" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 font-mono text-xs focus:outline-none focus:border-cyan-500" />
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Role & Responsibility <span class="text-rose-400">*</span></label>
            <input id="modal-crud-role" type="text" placeholder="e.g. Security Auditor" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 font-mono text-xs focus:outline-none focus:border-cyan-500" />
          </div>
        </div>

        <!-- Row 2: Multi-Engine Execution Architecture & Primary LLM Model (Side-by-side adaptive!) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div class="bg-slate-900/60 p-2.5 sm:p-3 rounded-xl border border-slate-800 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-slate-300 font-bold block">Execution Engine <span class="text-rose-400">*</span></label>
                <span class="text-[9px] text-cyan-400 font-mono">ADAPTER</span>
              </div>
              <select id="modal-crud-engine" onchange="onCrudEngineChange(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 font-mono text-xs focus:outline-none focus:border-cyan-500">
                <option value="hermes">Hermes Agent (Autonomous Shell & Gateway)</option>
                <option value="claude">Claude Code (Headless Orchestrator)</option>
                <option value="agy">Antigravity AGY (Pair Programmer)</option>
                <option value="opencode">OpenCode (Multi-Model Agent)</option>
                <option value="codex">OpenAI Codex (CLI Engine)</option>
              </select>
            </div>
            <div class="mt-2.5">
              <label class="text-slate-400 block mb-1">Failover Secondary Model (Optional)</label>
              <input id="modal-crud-fallback" type="text" placeholder="e.g. groq/openai/gpt-oss-120b" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-amber-300 font-mono text-xs focus:outline-none focus:border-amber-500" />
            </div>
          </div>

          <div class="bg-slate-900/60 p-2.5 sm:p-3 rounded-xl border border-cyan-900/40 flex flex-col justify-between">
            <div>
              <label class="text-cyan-300 font-bold block mb-1">Primary LLM Model <span class="text-rose-400">*</span></label>
              <input id="modal-crud-model" type="text" value="abacus/gemini-3.8-flash" placeholder="provider/model-id" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-cyan-300 font-mono text-xs focus:outline-none focus:border-cyan-500" />
            </div>
            <div class="mt-2">
              <span class="text-[10px] text-slate-500 block mb-1">Compatible Engine Models (Click to pick):</span>
              <div id="modal-crud-engine-picks" class="flex flex-wrap gap-1">
                <button type="button" onclick="document.getElementById('modal-crud-model').value='claude-sonnet-5-5'" class="px-1.5 py-0.5 rounded bg-amber-950/80 hover:bg-amber-900 border border-amber-800 text-[10px] text-amber-300 font-semibold cursor-pointer">sonnet-5.5</button>
                <button type="button" onclick="document.getElementById('modal-crud-model').value='abacus/gemini-3.8-flash'" class="px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-cyan-400 cursor-pointer">gemini-3.8</button>
                <button type="button" onclick="document.getElementById('modal-crud-model').value='abacus/gpt-4.1-mini'" class="px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-cyan-400 cursor-pointer">gpt-4.1-mini</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Workstation Theme & Operational Archetype (Clean Compact Micro-Grid) -->
        <div class="bg-slate-950/60 p-2.5 sm:p-3 rounded-xl border border-slate-800/80">
          <label class="text-slate-400 block mb-1.5 text-[11px] font-semibold">Workstation Theme & Operational Archetype</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5" id="crud-color-picker">
            <button type="button" onclick="setCrudColor('#10b981', 'orchestrator')" class="px-2 py-1.5 rounded-lg border text-[10.5px] font-mono flex items-center gap-1.5 bg-emerald-950/60 border-emerald-600 text-emerald-300 hover:border-emerald-500 transition cursor-pointer">
              <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span> <span class="truncate">Orchestrator</span>
            </button>
            <button type="button" onclick="setCrudColor('#38bdf8', 'developer')" class="px-2 py-1.5 rounded-lg border text-[10.5px] font-mono flex items-center gap-1.5 bg-sky-950/60 border-sky-600 text-sky-300 hover:border-sky-500 transition cursor-pointer">
              <span class="w-2 h-2 rounded-full bg-sky-500 shrink-0"></span> <span class="truncate">Developer</span>
            </button>
            <button type="button" onclick="setCrudColor('#6366f1', 'devops')" class="px-2 py-1.5 rounded-lg border text-[10.5px] font-mono flex items-center gap-1.5 bg-indigo-950/60 border-indigo-600 text-indigo-300 hover:border-indigo-500 transition cursor-pointer">
              <span class="w-2 h-2 rounded-full bg-indigo-500 shrink-0"></span> <span class="truncate">DevOps / Sys</span>
            </button>
            <button type="button" onclick="setCrudColor('#14b8a6', 'analyst')" class="px-2 py-1.5 rounded-lg border text-[10.5px] font-mono flex items-center gap-1.5 bg-teal-950/60 border-teal-600 text-teal-300 hover:border-teal-500 transition cursor-pointer">
              <span class="w-2 h-2 rounded-full bg-teal-500 shrink-0"></span> <span class="truncate">Analyst</span>
            </button>
            <button type="button" onclick="setCrudColor('#f43f5e', 'security')" class="px-2 py-1.5 rounded-lg border text-[10.5px] font-mono flex items-center gap-1.5 bg-rose-950/60 border-rose-600 text-rose-300 hover:border-rose-500 transition cursor-pointer">
              <span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span> <span class="truncate">Security / QA</span>
            </button>
            <button type="button" onclick="setCrudColor('#f59e0b', 'operations')" class="px-2 py-1.5 rounded-lg border text-[10.5px] font-mono flex items-center gap-1.5 bg-amber-950/60 border-amber-600 text-amber-300 hover:border-amber-500 transition cursor-pointer">
              <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span> <span class="truncate">Operations</span>
            </button>
            <button type="button" onclick="setCrudColor('#a855f7', 'creative')" class="px-2 py-1.5 rounded-lg border text-[10.5px] font-mono flex items-center gap-1.5 bg-purple-950/60 border-purple-600 text-purple-300 hover:border-purple-500 transition cursor-pointer">
              <span class="w-2 h-2 rounded-full bg-purple-500 shrink-0"></span> <span class="truncate">Creative</span>
            </button>
          </div>
          <input type="hidden" id="modal-crud-color" value="#10b981" />
          <input type="hidden" id="modal-crud-theme" value="orchestrator" />
        </div>

        <!-- Voice Synthesis Settings (Compact Inline 3-Col) -->
        <div class="bg-slate-950/60 p-2.5 sm:p-3 rounded-xl border border-slate-800/80">
          <span class="text-slate-400 font-semibold block text-[11px] mb-1.5">Speech & Voice Persona:</span>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 items-center">
            <div>
              <label class="text-slate-500 text-[10px] block mb-0.5">Gender</label>
              <select id="modal-crud-voice-gender" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-slate-200 font-mono text-xs">
                <option value="female">Female</option>
                <option value="male">Male</option>
              </select>
            </div>
            <div>
              <div class="flex justify-between items-center mb-0.5">
                <label class="text-slate-500 text-[10px]">Pitch</label>
                <span id="crud-pitch-val" class="text-cyan-400 text-[10px] font-bold">1.0</span>
              </div>
              <input id="modal-crud-voice-pitch" type="range" min="0.5" max="1.5" step="0.05" value="1.0" oninput="document.getElementById('crud-pitch-val').innerText=this.value" class="w-full accent-cyan-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer" />
            </div>
            <div>
              <div class="flex justify-between items-center mb-0.5">
                <label class="text-slate-500 text-[10px]">Rate / Speed</label>
                <span id="crud-rate-val" class="text-cyan-400 text-[10px] font-bold">1.0</span>
              </div>
              <input id="modal-crud-voice-rate" type="range" min="0.5" max="1.5" step="0.05" value="1.0" oninput="document.getElementById('crud-rate-val').innerText=this.value" class="w-full accent-cyan-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer" />
            </div>
          </div>
        </div>

        <!-- System Prompt / Starter Memory -->
        <div id="modal-crud-prompt-container">
          <label class="text-slate-400 block mb-1">Initial Persona / Directive (saved to MEMORY.md)</label>
          <textarea id="modal-crud-prompt" rows="2" placeholder="Core mission instructions and behavioral tone for this specialist..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-300 font-mono text-xs focus:outline-none focus:border-cyan-500 resize-y"></textarea>
        </div>
      </div>

      <!-- Sticky Modal Footer (Pinned outside scrollable body) -->
      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-between items-center gap-2 shrink-0 z-10">
        <button id="modal-crud-decommission-btn" type="button" onclick="decommissionCurrentAgent()" class="px-3.5 py-2 rounded-xl bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800 text-xs font-semibold hidden transition flex items-center gap-1.5 cursor-pointer">
          <span>🗑️</span> <span>Decommission Agent</span>
        </button>
        <div class="flex gap-2.5 ml-auto">
          <button type="button" onclick="closeAgentCrudModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition cursor-pointer">Cancel</button>
          <button type="button" onclick="submitSaveAgent()" id="modal-crud-submit-btn" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-md cursor-pointer">
            <span>🚀</span> <span>Deploy New Agent</span>
          </button>
        </div>
      </div>
    </div>
  </div>
