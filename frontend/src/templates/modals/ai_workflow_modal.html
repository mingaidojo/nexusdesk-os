<!-- AI Workflow Architect Modal (BL-AUTO-37) -->
  <div id="ai-workflow-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[115] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-cyan-800/80 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-cyan-400 text-lg">✨</span>
          <div>
            <h3 class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">AI WORKFLOW ARCHITECT</h3>
            <span class="text-[9px] sm:text-[10px] text-slate-400 font-mono">Synthesize multi-agent pipelines from natural language prompts</span>
          </div>
        </div>
        <button onclick="closeAIWorkflowArchitectModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>

      <div class="p-4 sm:p-5 overflow-y-auto flex-1 custom-scrollbar space-y-3.5 text-xs font-mono">
        <div>
          <label class="text-slate-300 font-semibold block mb-1">What would you like the agents to automate?</label>
          <textarea id="ai-workflow-directive" rows="3" placeholder="e.g. Create a continuous website health patrol that monitors Docker containers, queries database uptime, and alerts Min on Telegram when latency exceeds 500ms..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 text-xs focus:outline-none focus:border-cyan-500 resize-none leading-relaxed"></textarea>
        </div>

        <div class="flex items-center justify-between">
          <span class="text-[10px] text-slate-500">Assigns fleet specialists and binds matching skills</span>
          <button type="button" id="btn-generate-ai-wf" onclick="generateAIWorkflowDraft()" class="px-3.5 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold flex items-center gap-1.5 transition cursor-pointer">
            <span>✨ Synthesize Pipeline</span>
          </button>
        </div>

        <!-- Generated Draft Preview -->
        <div id="ai-workflow-result-box" class="hidden space-y-2 pt-2 border-t border-slate-800">
          <div class="flex items-center justify-between">
            <span class="font-bold text-slate-200 uppercase tracking-wider text-[11px]">Proposed Architecture Preview</span>
            <span id="ai-wf-steps-count" class="text-cyan-400 text-[10px]"></span>
          </div>
          <div id="ai-wf-preview-card" class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2"></div>
        </div>
      </div>

      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-end gap-2 shrink-0">
        <button onclick="closeAIWorkflowArchitectModal()" class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition cursor-pointer">Cancel</button>
        <button type="button" id="btn-apply-ai-wf" onclick="applyAIWorkflowDraft()" class="hidden px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition shadow cursor-pointer">
          Apply to Workflows
        </button>
      </div>
    </div>
  </div>
