<!-- Create & Edit Workflow Pipeline Modal -->
  <div id="workflow-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-slate-800 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <!-- Pinned Header -->
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div>
          <h3 id="modal-wf-title" class="font-bold text-xs sm:text-sm text-slate-100 font-pixel">CREATE WORKFLOW PIPELINE</h3>
          <span class="text-[9px] sm:text-[10px] text-slate-400 font-mono">Define sequential multi-agent execution steps with handovers</span>
        </div>
        <button onclick="closeWorkflowModal()" class="text-slate-400 hover:text-white text-lg leading-none p-1 cursor-pointer">&times;</button>
      </div>
      <input type="hidden" id="modal-wf-id" value="" />
      
      <!-- Scrollable Body -->
      <div class="space-y-3.5 text-xs p-3.5 sm:p-5 overflow-y-auto flex-1 custom-scrollbar">
        <div>
          <label class="text-slate-300 font-semibold block mb-1">Workflow Name</label>
          <input id="modal-wf-name" type="text" placeholder="e.g. Daily Scripture Reflection Pipeline" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono text-xs focus:outline-none focus:border-cyan-600" />
        </div>

        <div>
          <label class="text-slate-300 font-semibold block mb-1">Description</label>
          <input id="modal-wf-desc" type="text" placeholder="e.g. Multi-agent research, storyboard drafting, and publishing pipeline" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-300 font-mono text-xs focus:outline-none focus:border-cyan-600" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-slate-300 font-semibold flex items-center gap-1.5">
              <span>⏱️</span> <span>Default Step Timeout</span>
            </label>
            <span class="text-[10px] text-slate-500 font-mono">Applies to steps unless overridden</span>
          </div>
          <select id="modal-wf-timeout" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono text-xs focus:outline-none focus:border-cyan-600 cursor-pointer">
            <option value="60">1 Minute (60s) — Fast alerts / pings</option>
            <option value="180">3 Minutes (180s) — Standard copy / single lookup</option>
            <option value="300" selected>5 Minutes (300s) — Deep reasoning & research (Default)</option>
            <option value="600">10 Minutes (600s) — Heavy models & orchestration (Solaris 550B)</option>
            <option value="720">12 Minutes (720s) — Maximum execution ceiling</option>
          </select>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-slate-300 font-semibold flex items-center gap-1.5">
              <span>⚡</span> <span>Model Execution Profile</span>
            </label>
            <span class="text-[10px] text-slate-500 font-mono">Cascading failover for reliability</span>
          </div>
          <select id="modal-wf-model-profile" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono text-xs focus:outline-none focus:border-cyan-600 cursor-pointer">
            <option value="free_fast" selected>🆓⚡ Free Fast → Economical → Agent Default (Recommended for DAGs)</option>
            <option value="economical">💰 Economical → Agent Default (Gemini 3.8 Flash → GPT-4.1 Mini)</option>
            <option value="strict_json">🧩 Strict Tool/JSON (GPT-4.1 Mini → Gemini 3.8 Flash)</option>
            <option value="agent_default">🤖 Agent Fleet Default (War Room Flagship Models)</option>
          </select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-slate-300 font-semibold flex items-center gap-1.5">
              <span>🪜</span> <span>Execution Steps &amp; Handovers</span>
            </label>
            <button type="button" onclick="addWorkflowStepRow()" class="px-2.5 py-1 rounded-lg bg-cyan-900/80 hover:bg-cyan-800 text-cyan-300 border border-cyan-700/80 text-[11px] font-semibold flex items-center gap-1 transition cursor-pointer">
              <span>+ Add Step</span>
            </button>
          </div>

          <div id="modal-wf-steps-list" class="space-y-2.5 max-h-60 overflow-y-auto p-1 custom-scrollbar">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- Pinned Footer -->
      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-end gap-2 shrink-0 z-10">
        <button onclick="closeWorkflowModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition cursor-pointer">Cancel</button>
        <button onclick="submitSaveWorkflow()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition shadow-md cursor-pointer">Save Workflow</button>
      </div>
    </div>
  </div>
