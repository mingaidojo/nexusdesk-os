<!-- MODAL: CREATE NEW WAR ROOM (BL-WAR-14: Fleet-Agnostic & Cross-Fleet Room Synthesis) -->
  <div id="modal-create-warroom" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[125] flex items-center justify-center p-3 overflow-hidden" onclick="if(event.target===this) closeCreateWarRoomModal()">
    <div class="bg-[#161b22] border border-cyan-700/80 rounded-2xl w-full max-w-lg shadow-2xl flex flex-col max-h-[88vh] overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between shrink-0 bg-[#0d1117]">
        <div class="flex items-center gap-2">
          <span class="text-cyan-400 text-base">👥</span>
          <div>
            <h3 class="font-bold text-white text-sm font-pixel">CREATE NEW WAR ROOM</h3>
            <span class="text-[10px] font-mono text-cyan-400 block">Cross-Fleet & Multi-Engine Conference</span>
          </div>
        </div>
        <button onclick="closeCreateWarRoomModal()" class="text-slate-400 hover:text-white text-sm font-mono cursor-pointer">✕</button>
      </div>

      <div class="p-4 sm:p-5 flex flex-col gap-3.5 overflow-y-auto custom-scrollbar text-xs font-mono">
        <div>
          <label class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Room Name / Mission Title</label>
          <input id="create-warroom-name-input" type="text" placeholder="e.g. Architecture Review, Database Migration..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500 font-mono" />
        </div>

        <div>
          <label class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Initial Topic / Context (Optional)</label>
          <input id="create-warroom-topic-input" type="text" placeholder="Optional initial context or objective for the room..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
          <div>
            <label class="text-[10px] text-cyan-400 uppercase font-bold block mb-1">Domain Workflow Preset (BL-WAR-36)</label>
            <select id="create-warroom-preset-select" onchange="onCreateWarRoomDomainPresetChange(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-500 font-mono cursor-pointer">
              <option value="general_conference">🌐 General Conference</option>
              <option value="coding_sprint">⚡ Collaborative Coding Sprint</option>
              <option value="deep_research">🔬 Deep Research & Data Synthesis</option>
              <option value="security_audit">🛡️ SRE & Security Red-Teaming</option>
              <option value="executive_advisory">📊 Executive Board & Pitch Deck</option>
            </select>
          </div>
          <div class="flex flex-col justify-center">
            <label class="flex items-center gap-2 text-xs text-slate-200 cursor-pointer mt-2 sm:mt-4">
              <input type="checkbox" id="create-warroom-worktree-cb" class="accent-cyan-500 w-3.5 h-3.5 rounded" />
              <span class="font-bold text-amber-300">🌿 Isolated Agent Worktrees</span>
            </label>
            <span class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">Gives each agent its own sandbox worktree directory to prevent edit collisions.</span>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[10px] text-slate-400 uppercase font-bold">Quick Fleet / Panel Presets</label>
            <span id="create-warroom-selected-count" class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800 text-[10px] font-mono font-bold">3 selected</span>
          </div>
          <div class="flex flex-wrap gap-1.5 mb-2.5">
            <button type="button" onclick="selectCreateWarRoomPreset('core')" class="px-2 py-1 rounded bg-cyan-950/90 hover:bg-cyan-900 border border-cyan-700 text-cyan-200 text-[10px] font-mono font-semibold transition cursor-pointer" title="Solaris (Hermes) + Claude + Agy">🌐 Core Triad (Default)</button>
            <button type="button" onclick="selectCreateWarRoomPreset('coding')" class="px-2 py-1 rounded bg-amber-950/80 hover:bg-amber-900 border border-amber-700 text-amber-200 text-[10px] font-mono font-semibold transition cursor-pointer" title="Claude + Agy + OpenCode + Codex">⚡ Coding Engines (4)</button>
            <button type="button" onclick="selectCreateWarRoomPreset('biblestory')" class="px-2 py-1 rounded bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-700 text-emerald-200 text-[10px] font-mono font-semibold transition cursor-pointer" title="All agents_bs Hermes specialists">📖 BibleStory Fleet</button>
            <button type="button" onclick="selectCreateWarRoomPreset('all')" class="px-2 py-1 rounded bg-purple-950/80 hover:bg-purple-900 border border-purple-700 text-purple-200 text-[10px] font-mono font-semibold transition cursor-pointer" title="Every specialist across all fleets">🚀 Universal All</button>
          </div>

          <div class="mb-2">
            <input id="create-warroom-search-input" type="text" oninput="filterCreateWarRoomAgents(this.value)" placeholder="🔍 Filter specialists by name, engine, or role..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-cyan-300 placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-mono" />
          </div>

          <div id="create-warroom-participants-list" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 max-h-52 overflow-y-auto custom-scrollbar pr-1">
            <!-- Dynamically populated cross-fleet participants -->
          </div>
        </div>
      </div>

      <div class="px-4 py-3 border-t border-slate-800 bg-[#0d1117] flex items-center justify-between shrink-0">
        <span class="text-[10px] font-mono text-slate-400">Any fleet agent can be roped in later</span>
        <div class="flex items-center gap-2">
          <button type="button" onclick="closeCreateWarRoomModal()" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition cursor-pointer">Cancel</button>
          <button type="button" onclick="submitCreateWarRoomModal()" class="px-4 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold transition cursor-pointer shadow-md flex items-center gap-1.5">
            <span>👥</span> <span>Convene War Room</span>
          </button>
        </div>
      </div>
    </div>
  </div>
