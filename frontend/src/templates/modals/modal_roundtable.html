<!-- Modal: Automated Multi-Agent Round-Table Debate -->
  <div id="modal-roundtable" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-2.5 sm:p-4 md:p-6 overflow-hidden">
    <div class="bg-[#161b22] border border-slate-800 rounded-2xl w-full max-w-xl shadow-2xl flex flex-col max-h-[calc(100vh-1.5rem)] sm:max-h-[88vh] overflow-hidden">
      <!-- Pinned Header -->
      <div class="flex justify-between items-center px-4 py-3 sm:px-5 border-b border-slate-800 bg-[#161b22] shrink-0">
        <div>
          <h2 class="text-xs sm:text-sm font-bold text-white font-pixel flex items-center gap-2">
            <span>🎯</span> <span>CONVENE ROUND-TABLE DISCUSSION</span>
          </h2>
          <p class="text-[10px] text-slate-400 mt-0.5">Automated multi-turn debate & collaborative deliberation between agents</p>
        </div>
        <button onclick="closeRoundTableModal()" class="text-slate-400 hover:text-white text-lg font-mono p-1 cursor-pointer">&times;</button>
      </div>

      <!-- Scrollable Body -->
      <div class="space-y-3.5 text-xs p-3.5 sm:p-5 overflow-y-auto flex-1 custom-scrollbar">
        <div>
          <label class="block text-slate-300 font-semibold mb-1">Deliberation Topic / Problem Statement *</label>
          <textarea id="roundtable-topic-input" rows="2" 
                    placeholder="e.g. Design resilient failover architecture across all 4 VPS fleets and propose benchmark tests..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-sans resize-y"></textarea>
        </div>

        <div>
          <div class="flex flex-wrap justify-between items-center gap-2 mb-1.5">
            <div class="flex items-center gap-2">
              <label class="block text-slate-300 font-semibold">Select Panelists (2–5 Agents) *</label>
              <span id="roundtable-selected-count" class="px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800 text-[10px] font-mono font-bold">3 selected</span>
            </div>
            <div class="flex items-center gap-1 text-[10px] font-mono">
              <button type="button" onclick="selectRoundTablePreset('core')" class="px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-slate-800 cursor-pointer transition">Core Trio</button>
              <button type="button" onclick="selectRoundTablePreset('all')" class="px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 text-cyan-400 border border-slate-800 cursor-pointer transition">Select All</button>
              <button type="button" onclick="selectRoundTablePreset('clear')" class="px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 cursor-pointer transition">Clear</button>
            </div>
          </div>
          <div id="roundtable-panelist-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto p-2 bg-slate-950/60 rounded-xl border border-slate-800/80 custom-scrollbar">
            <!-- Populated dynamically with agent checkboxes -->
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Discussion Depth (Panel Rotations)</label>
            <select id="roundtable-rounds-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cyan-500 font-mono">
              <option value="1">1 Round (Fast Pitch & Feedback)</option>
              <option value="2">2 Rounds (Deep Critique & Refinement)</option>
              <option value="3" selected>3 Rounds (Comprehensive Exhaustive Debate)</option>
              <option value="4">4 Rounds (Thorough Cross-Review & Audit)</option>
              <option value="5">5 Rounds (Deep Dive Multi-Phase Investigation)</option>
              <option value="6">6 Rounds (Exhaustive Full-Consensus Marathon)</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Closing Synthesis</label>
            <div class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-[11px] text-emerald-400 font-mono flex items-center gap-1.5 h-[34px]">
              <span>✓ Auto-Lead Synthesizer</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Pinned Footer -->
      <div class="px-4 py-2.5 sm:px-5 sm:py-3 border-t border-slate-800 bg-[#161b22] flex justify-end gap-2 shrink-0 z-10">
        <button onclick="closeRoundTableModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition cursor-pointer">Cancel</button>
        <button onclick="launchRoundTableDiscussion()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-md cursor-pointer">
          <span>🚀</span> <span>Launch Roundtable</span>
        </button>
      </div>
    </div>
  </div>
