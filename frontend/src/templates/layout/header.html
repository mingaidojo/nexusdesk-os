<header class="border-b border-slate-800/80 bg-[#161b22]/90 backdrop-blur-md px-3 md:px-5 py-2 sticky top-0 z-30 w-full transition-all">
      <div class="w-full flex items-center justify-between gap-2 md:gap-4 h-10">
      
      <!-- Zone 1 (Left): Hamburger & Streamlined Workspace Breadcrumb -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Mobile Drawer Hamburger Button -->
        <button onclick="toggleMobileSidebar(true)" class="md:hidden p-1.5 rounded-lg bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-700/70 text-xs flex items-center justify-center transition" title="Open Navigation Menu">
          ☰
        </button>

        <!-- Brand / Section Breadcrumb -->
        <div class="flex items-center gap-1.5 font-mono">
          <span id="header-breadcrumb-title" class="text-xs font-bold text-slate-200 tracking-wider flex items-center gap-1.5">
            <span class="text-emerald-400">🏢</span>
            <span>AGENTFLOOR</span>
          </span>
          <span class="text-slate-600 text-xs hidden sm:inline">/</span>
          <span id="header-breadcrumb-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-900/80 text-cyan-400 border border-slate-800 tracking-wide hidden sm:inline-block">VIRTUAL OFFICE</span>
        </div>

        <!-- Zone 2: Unified Fleet Capsule (Integrated Dropdown + Micro Sync) -->
        <div class="relative flex items-center" id="fleet-selector-wrapper">
          <div class="flex items-center bg-slate-900/90 border border-slate-700/70 rounded-lg p-0.5 shadow-sm hover:border-slate-600 transition">
            <!-- Active Fleet Dropdown Trigger -->
            <button type="button" onclick="toggleFleetDropdown()" id="fleet-selector-btn" class="flex items-center gap-1.5 px-2 py-1 font-mono text-[11px] text-slate-200 hover:text-white cursor-pointer transition">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" id="current-fleet-dot"></span>
              <span class="font-semibold text-slate-100 truncate max-w-[120px] sm:max-w-[150px]" id="current-fleet-label">biblestoryapp</span>
              <span class="text-[9px] text-slate-400">▾</span>
            </button>
            <div class="h-3.5 w-[1px] bg-slate-800 my-auto"></div>
            <!-- Micro Icon-Only Sync Button Docked in Capsule -->
            <button type="button" onclick="syncAllFleetState(true)" id="header-sync-fleet-btn" title="Force re-sync active fleet instances, models, tools & crons (Zero-Stale Cache)" class="px-2 py-1 text-slate-400 hover:text-cyan-400 transition cursor-pointer" aria-label="Sync Fleet">
              <span id="header-sync-icon" class="inline-block text-[11px] leading-none transition-transform duration-300">🔄</span>
            </button>
          </div>

          <!-- Notification Badges / Toasts -->
          <span id="header-sync-toast" class="hidden absolute left-full ml-2 text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-700 shadow z-50 whitespace-nowrap">Synced!</span>
          <span id="fleet-discovered-toast" class="hidden absolute left-full ml-2 text-[10px] font-mono px-2 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-700 shadow animate-pulse z-50 whitespace-nowrap">✨ New fleet detected!</span>

          <!-- Dropdown Menu -->
          <div id="fleet-dropdown-menu" class="hidden nexus-popover-menu absolute left-0 top-full mt-1.5 w-64 max-w-[calc(100vw-2rem)] py-1.5 z-50 font-mono text-xs">
            <div class="px-3 py-1.5 text-[9px] text-slate-500 font-bold uppercase tracking-wider border-b border-slate-800 flex justify-between items-center">
              <span>SWITCH HERMES FLEET</span>
              <span id="fleet-count-badge" class="text-cyan-400">4 Fleets</span>
            </div>
            <div id="fleet-dropdown-options" class="py-1 max-h-56 sm:max-h-64 overflow-y-auto custom-scrollbar">
              <!-- populated dynamically -->
            </div>
          </div>
        </div>
      </div>

      <!-- Zone 3 & 4 (Right): Segmented Micro-Time Capsule + Unified Telemetry + Dev Mode + Voice Controls -->
      <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
        <!-- Segmented Micro-Time Capsule (Desktop) -->
        <button type="button" onclick="openTimezoneModal()" class="hidden md:flex items-center gap-1.5 bg-slate-900/90 hover:bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-800 hover:border-slate-700 transition font-mono text-[11px] text-slate-300 cursor-pointer shadow-sm" title="Server Hardware & Local Clocks (Click to configure)">
          <span class="text-slate-400 hidden 2xl:inline" title="Server Hardware Time (CEST)"><span id="header-server-time">--:--:-- CEST</span></span>
          <span class="text-slate-700 hidden 2xl:inline">·</span>
          <span class="text-emerald-400 font-semibold" title="User Local Time"><span id="header-local-time">--:--:--</span></span>
          <span id="header-tz-badge" class="text-[9px] px-1 py-0.2 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 font-bold">GMT+7</span>
        </button>

        <!-- Consolidated Telemetry Health Pill (Desktop: Visible on wide xl screens to preserve bar space) -->
        <div id="telemetry-bar" class="hidden xl:flex items-center gap-2 bg-slate-900/90 px-2.5 py-1 rounded-lg border border-slate-800 text-xs font-mono">
          <div class="flex items-center gap-1">
            <span class="text-[9px] text-slate-500 font-bold">CPU</span>
            <span id="metric-cpu" class="text-emerald-400 font-semibold text-[11px]">--%</span>
          </div>
          <span class="text-slate-700">·</span>
          <div class="flex items-center gap-1">
            <span class="text-[9px] text-slate-500 font-bold">RAM</span>
            <span id="metric-ram" class="text-cyan-400 font-semibold text-[11px]">--%</span>
            <span id="metric-ram-mb" class="text-[9px] text-slate-500 hidden 2xl:inline"></span>
          </div>
          <span class="text-slate-700">·</span>
          <div class="flex items-center gap-1">
            <span class="text-[9px] text-slate-500 font-bold">DISK</span>
            <span id="metric-disk" class="text-amber-400 font-semibold text-[11px]">-- GB</span>
          </div>
        </div>

        <!-- BL-SYS-20: Header Quick Daemon Telemetry Pill & 1-Click Restart Action -->
        <div id="header-daemon-pill" class="hidden sm:flex items-center gap-1.5 bg-slate-900/90 px-2 py-1 rounded-lg border border-slate-800 text-xs font-mono shadow-sm" title="NexusDesk Daemon Status & Quick Restart">
          <span id="header-daemon-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="header-daemon-status" class="text-[10px] text-emerald-300 font-semibold font-mono tracking-tight">nexusdesk: active</span>
          <button type="button" onclick="confirmRestartNexusDesk()" class="text-slate-400 hover:text-rose-400 hover:rotate-180 transition-all duration-300 ml-1 p-0.5 rounded cursor-pointer" title="Quick Restart NexusDesk Daemon (nexusdesk.service)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        </div>

        <!-- Security / Dev Mode Badge (Compact Icon Only) -->
        <button id="security-mode-badge" onclick="openSecuritySettingsModal()" class="hidden sm:flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-900/90 border border-slate-800 hover:border-slate-700 text-xs font-mono transition cursor-pointer" title="Security & Authentication Settings">
          <span id="security-mode-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span id="security-mode-text" class="hidden"></span>
        </button>

        <!-- Mobile Quick Controls -->
        <div class="flex md:hidden items-center gap-1">
          <button id="security-mode-badge-mob" onclick="openSecuritySettingsModal()" class="flex items-center gap-1 px-1.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-[10px] text-slate-400 font-mono" title="Security Settings">
            <span id="security-mode-dot-mob" class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
            <span id="security-mode-text-mob" class="hidden"></span>
          </button>
          <button type="button" onclick="openTimezoneModal()" class="flex items-center gap-1 px-1.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-[10px] text-emerald-400 font-mono font-semibold" title="Tap to switch local timezone">
            <span id="header-local-time-mob">--:--</span>
            <span id="header-tz-badge-mob" class="text-[8px] text-slate-400">GMT+7</span>
          </button>
          <button id="btn-tts-mob" onclick="toggleAudioReply()" class="p-1 rounded-lg bg-slate-900 text-slate-300 border border-slate-800 transition" title="Toggle audio">
            <svg id="tts-icon-on-mob" class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <svg id="tts-icon-off-mob" class="w-3.5 h-3.5 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
          </button>
          <button type="button" onclick="openFeatureGuide()" class="px-1.5 py-1 rounded-lg bg-slate-900 text-cyan-300 border border-slate-800 text-[10px] font-mono font-bold transition" title="Feature Guide & Playbook">?</button>
        </div>

        <!-- Desktop Audio Mute Toggle & Feature Guide Trigger -->
        <div class="hidden md:flex items-center gap-1.5 shrink-0">
          <button id="btn-tts" onclick="toggleAudioReply()" class="p-1.5 rounded-lg bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-800 hover:border-slate-700 transition" title="Toggle Spoken Voice Audio">
            <svg id="tts-icon-on" class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <svg id="tts-icon-off" class="w-3.5 h-3.5 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
          </button>
          <button type="button" id="header-guide-btn" onclick="openFeatureGuide()" class="px-2 py-1 rounded-lg bg-slate-900/90 hover:bg-cyan-950/70 text-cyan-300 hover:text-cyan-200 border border-slate-800 hover:border-cyan-700 text-xs font-mono font-bold transition cursor-pointer" title="NexusDesk Feature Guide & Command Playbook (Ctrl+/)">
            ?
          </button>
        </div>
      </div>
      </div>
    </header>
